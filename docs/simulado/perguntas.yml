  opcoes:
    - 'Porque é obrigatório.'
    - 'Para reduzir os documentos processados nas etapas seguintes e aproveitar índices.'
    - 'Porque o `$group` só funciona depois do `$sort`.'
    - 'Para ordenar o resultado.'
