  opcoes:
    - 'O Scrum Master'
    - 'Os desenvolvedores'
    - 'O Product Owner'
    - 'O gerente de projetos'
  resposta: 2
  explicacao: 'O Product Owner cuida do Product Backlog e decide a ordem de prioridade para maximizar o valor entregue.'

- modulo: 1
  aula: 01-principios/09-kanban.md
  pergunta: 'Para que serve o **limite de WIP** em um quadro Kanban?'
  opcoes:
    - 'Para limitar o número de pessoas no time.'
    - 'Para limitar quantas tarefas podem estar em andamento ao mesmo tempo, evitando trabalho acumulado.'
    - 'Para definir a duração da sprint.'
    - 'Para limitar o número de colunas do quadro.'
