    - '`db.produtos.updateOne({ nome: "X" }, { $inc: { estoque: 1 } })`'
    - '`db.produtos.insertOne({ estoque: 1 })`'
    - '`db.produtos.update({ nome: "X" }, { $add: 1 })`'
  resposta: 1
  explicacao: 'O operador `$inc` incrementa. Sem um operador (`$set`, `$inc`...), o `updateOne` recusa a operação.'

