- modulo: 1
  aula: 01-principios/08-scrum.md
  pergunta: 'Quais são os três pilares do Scrum?'
  opcoes:
    - 'Planejamento, execução e entrega'
    - 'Transparência, inspeção e adaptação'
    - 'Velocidade, qualidade e custo'
    - 'Backlog, sprint e incremento'
  resposta: 1
  explicacao: 'O Scrum se baseia no empirismo, sustentado por transparência, inspeção e adaptação. Backlog, sprint e incremento são artefatos e eventos, não pilares.'

- modulo: 1
