    - 'Duas partition keys'
    - 'ID + data de criação, obrigatoriamente'
    - 'Partition key + GSI'
  resposta: 0
  explicacao: 'A chave pode ser simples (só partition key) ou composta (partition + sort). A sort key ordena os itens que têm a mesma partition key.'

- modulo: 5
  aula: 05-banco-de-dados/07-dynamodb.md
  pergunta: 'Para que serve um **GSI** (índice secundário global) no DynamoDB?'
  opcoes:
    - 'Para fazer backup da tabela.'
    - 'Para consultar a tabela por atributos que não fazem parte da chave primária.'
    - 'Para criptografar os dados.'
    - 'Para aumentar o limite de tamanho dos itens.'
  resposta: 1
  explicacao: 'Sem índice, o `query` só funciona pela chave da tabela. Um GSI define outra chave (partition e sort) para consultas diferentes.'

- modulo: 5
