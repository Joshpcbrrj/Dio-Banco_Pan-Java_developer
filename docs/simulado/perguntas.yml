    - 'Todos os atributos do item'
    - 'O nome do usuário da AWS'
  resposta: 1
  explicacao: 'O `query` busca dentro de uma partição, então a partition key é obrigatória. Buscar sem ela exige um `scan`, que lê a tabela inteira.'

