# ---------------------------------------------------------------- Módulo 1
- modulo: 1
  aula: 01-principios/01-git-e-github.md
  pergunta: 'Qual a diferença entre **Git** e **GitHub**?'
  opcoes:
    - 'São a mesma coisa: GitHub é só o nome comercial do Git.'
    - 'Git é o sistema de controle de versão; GitHub é uma plataforma online que hospeda repositórios Git.'
    - 'GitHub é o sistema de controle de versão; Git é o site onde ficam os projetos.'
    - 'Git só funciona com internet; GitHub funciona offline.'
  resposta: 1
  explicacao: 'O Git roda no seu computador e guarda o histórico. O GitHub hospeda repositórios Git na nuvem e acrescenta colaboração (pull requests, issues, Actions).'

- modulo: 1
  aula: 01-principios/02-como-o-git-funciona.md
  pergunta: 'No Git, o que é um **blob**?'
  opcoes:
    - 'Uma branch temporária.'
    - 'O conteúdo de um arquivo, identificado por um hash.'
    - 'Uma pasta do projeto.'
    - 'Um commit que ainda não foi enviado ao GitHub.'
  resposta: 1
  explicacao: 'Blob guarda o conteúdo de um arquivo; tree representa uma pasta; commit é a foto do projeto com metadados e ponteiro para o commit pai.'

- modulo: 1
  aula: 01-principios/02-como-o-git-funciona.md
  pergunta: 'Por que o histórico do Git é considerado "à prova de adulteração"?'
  opcoes:
    - 'Porque só o dono do repositório pode fazer commits.'
    - 'Porque os commits são criptografados com senha.'
    - 'Porque cada commit tem um hash calculado a partir do conteúdo e do commit anterior; mudar algo muda todos os hashes seguintes.'
    - 'Porque o GitHub guarda uma cópia de segurança.'
  resposta: 2
  explicacao: 'O hash depende do conteúdo e do commit pai. Alterar um commit antigo mudaria o hash dele e de todos os que vêm depois, o que é facilmente detectado.'

- modulo: 1
  aula: 01-principios/03-primeiro-commit.md
  pergunta: 'Qual a sequência correta para salvar uma alteração no histórico local?'
  opcoes:
    - '`git commit` e depois `git add`'
    - '`git push` e depois `git commit`'
    - '`git add` e depois `git commit`'
    - '`git init` a cada alteração'
  resposta: 2
  explicacao: 'O `git add` coloca as alterações no staging; o `git commit` grava o que está no staging no histórico.'

- modulo: 1
  aula: 01-principios/04-ciclo-de-vida-e-conflitos.md
  pergunta: 'Você precisa desfazer um commit que **já foi enviado** e que outras pessoas já baixaram. Qual comando é o mais seguro?'
  opcoes:
    - '`git reset --hard`'
    - '`git revert`'
    - '`git restore`'
    - '`git rm`'
  resposta: 1
  explicacao: 'O `git revert` cria um novo commit que desfaz o anterior, sem reescrever o histórico compartilhado. O `reset` reescreve o histórico e deve ficar para commits só locais.'

- modulo: 1
  aula: 01-principios/04-ciclo-de-vida-e-conflitos.md
  pergunta: 'Depois de editar o trecho em conflito e apagar os marcadores `<<<<<<<`, `=======` e `>>>>>>>`, o que falta fazer?'
  opcoes:
    - 'Nada, o Git detecta sozinho.'
    - '`git add` no arquivo e `git commit`.'
    - '`git init` de novo.'
    - '`git reset --hard`.'
  resposta: 1
  explicacao: 'Com o conflito resolvido, você marca o arquivo como resolvido com `git add` e conclui o merge com `git commit`.'

