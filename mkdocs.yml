site_name: Banco Pan · Java Developer
site_description: Resumo completo do bootcamp Banco Pan Java Developer (DIO), escrito para quem está começando em Java, Spring e bancos de dados.
site_author: Josué B. Almeida
site_url: https://joshpcbrrj.github.io/Dio-Banco_Pan-Java_developer/
repo_url: https://github.com/Joshpcbrrj/Dio-Banco_Pan-Java_developer
repo_name: Joshpcbrrj/Dio-Banco_Pan-Java_developer
edit_uri: edit/main/docs/
copyright: Texto sob licença CC BY 4.0 · Slides e material do bootcamp © DIO

docs_dir: docs
exclude_docs: |
  simulado/perguntas.yml
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: pt-BR
  icon:
    logo: fontawesome/brands/java
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/simulado.js

extra_css:
  - stylesheets/extra.css

